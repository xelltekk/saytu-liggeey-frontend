<!doctype html><html lang="fr" data-theme="login-aqua"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><div id="app"></div><script type="module">
import {createApp,h} from 'vue'
import {createPinia} from 'pinia'
import {createRouter,createMemoryHistory} from 'vue-router'
import {Chart} from 'chart.js'
import {useAuthStore} from '/src/stores/auth.js'
import Dashboard from '/src/views/DashboardView.vue'
import '/src/style.css'
const pinia=createPinia(),router=createRouter({history:createMemoryHistory(),routes:[{path:'/:pathMatch(.*)*',component:{render:()=>null}}]})
const app=createApp({render:()=>h('main',{class:'app-surface p-4'},[h(Dashboard)])})
app.use(pinia).use(router)
useAuthStore().user={id:1,role:new URLSearchParams(location.search).get('role')||'admin',name:'Admin'}
window.testChart=()=>Chart.getChart(document.querySelector('canvas'))?.data.datasets.map(d=>({label:d.label,color:d.borderColor,data:[...d.data]}))
app.mount('#app')
</script></html>
