name: Deploy frontend to Infomaniak

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Stamp frontend entrypoint
        run: |
          sed -i "s|</head>|<meta name=\"x-deploy-sha\" content=\"$GITHUB_SHA\" /></head>|" dist/index.html

      - name: Write deployment marker
        run: |
          printf '{"commit":"%s","deployed_at":"%s"}\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > dist/deploy-version.json

      - name: Install deployment client
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy dist to Infomaniak
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_TARGET_DIR: ${{ secrets.SFTP_TARGET_DIR }}
        run: |
          missing=0
          for secret_name in SFTP_HOST SFTP_USERNAME SFTP_PASSWORD SFTP_TARGET_DIR; do
            if [ -z "${!secret_name}" ]; then
              echo "::error title=Missing GitHub secret::$secret_name is empty or not configured"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          normalized_host="$SFTP_HOST"
          normalized_host="${normalized_host#sftp://}"
          normalized_host="${normalized_host#ssh://}"
          normalized_host="${normalized_host#ftp://}"
          normalized_host="${normalized_host#ftpes://}"
          normalized_host="${normalized_host%%/*}"

          target_dir="${SFTP_TARGET_DIR%/}"
          if [[ "$target_dir" != */public ]]; then
            target_dir="${target_dir}/public"
          fi

          deploy_frontend() {
            local destination="$1"
            lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" "sftp://$normalized_host" <<EOF
          set cmd:fail-exit yes
          set sftp:auto-confirm yes
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          set net:max-retries 2
          set net:timeout 30
          cd "$destination"
          mirror --reverse --verbose dist/ .
          put dist/index.html -o index.html
          put dist/deploy-version.json -o deploy-version.json
          bye
          EOF
          }

          deploy_frontend "$target_dir"

      - name: Verify frontend is served online
        run: |
          expected_js="$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -n 1)"
          for attempt in 1 2 3 4 5 6; do
            online_js="$(curl -fsSL "https://saytu.xelltekk.com/index.html?deploy_check=$GITHUB_SHA&attempt=$attempt" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -n 1 || true)"
            if [ "$online_js" = "$expected_js" ]; then
              echo "Frontend verified online with $online_js"
              exit 0
            fi
            echo "Waiting for frontend refresh: expected $expected_js, got ${online_js:-none}"
            sleep 10
          done

          echo "::error title=Frontend not refreshed::The deployment finished, but saytu.xelltekk.com still serves a different bundle than dist/index.html."
          exit 1
